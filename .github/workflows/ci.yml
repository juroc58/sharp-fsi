name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast suite: verification + lint on two Python versions.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Run verification suite (F1-F19)
        run: |
          python verify_solver.py

  # Convergence study: quick smoke of the numerical sensitivity study.
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run quick convergence study
        run: |
          python scripts/convergence_study.py --quick --out-dir /tmp/cs

      - name: Re-run verification after convergence study
        run: |
          python verify_solver.py

  # Pure-Python job: verifies the engine runs without any JIT compilation.
  # sharpFSI has no numba dependency, so this is a belt-and-braces check that
  # the code is pure NumPy/SciPy/Matplotlib.
  no-jit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run verification suite with NUMBA_DISABLE_JIT=1
        run: |
          NUMBA_DISABLE_JIT=1 python verify_solver.py
